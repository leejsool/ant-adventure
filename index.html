<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>개미들의 대모험</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#120b06">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="개미 대모험">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  #nickbox{position:absolute;left:50%;top:50%;transform-origin:top center;transform:translate(-50%,0);text-align:center;font-family:'Jua','Malgun Gothic',sans-serif;color:#ffe9a8;white-space:nowrap}
  #nickbox input{font:inherit;font-size:26px;padding:8px 14px;border-radius:12px;border:3px solid #c99a5b;background:#2a1a0c;color:#fff;text-align:center;width:230px;outline:none}
  #nickbox input:focus{border-color:#ffd37a}
  #nickbox button{font:inherit;font-size:24px;margin-left:10px;padding:8px 20px;border-radius:12px;border:3px solid #c99a5b;background:#c99a5b;color:#3a2213;cursor:pointer}
  #nickbox .sub{font-size:14px;margin-top:8px;opacity:.75}
  #slots{margin-top:10px}
  .slot{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0}
  .slot .lab{width:270px;text-align:left;font-size:18px;overflow:hidden;text-overflow:ellipsis}
  .slot .lab small{display:block;font-size:12px;opacity:.7}
  #nickbox .slot button{font-size:17px;margin:0;padding:5px 14px}
  #nickbox .slot button.del{background:transparent;color:#ffb0a0;border-color:#a06050}
  html,body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #nickbox input{-webkit-user-select:text;user-select:text}
  #touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:5;font-family:'Jua','Malgun Gothic',sans-serif}
  body.touch.playing #touch{display:block}
  #touch button{pointer-events:auto;touch-action:none;border:2px solid rgba(255,255,255,.55);background:rgba(20,12,6,.45);color:#fff;font:inherit;font-size:15px;border-radius:50%;width:56px;height:56px;padding:0;line-height:1.1;-webkit-user-select:none;user-select:none}
  #touch button.on{background:rgba(255,226,122,.6);color:#3a2213}
  #dpad{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:14px;display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}
  #dpad button{border-radius:14px;font-size:22px}
  body:not(.dpad-on) #dpad{display:none}
  #acts{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:14px;display:grid;grid-template-columns:repeat(2,64px);grid-template-rows:repeat(2,64px);gap:8px}
  #acts button{width:64px;height:64px;font-size:16px}
  #sys{position:absolute;left:50%;transform:translateX(-50%);top:6px;display:flex;gap:8px}
  #sys button{width:44px;height:44px;font-size:12px;opacity:.8}
  #rotate{display:none;position:fixed;inset:0;z-index:9;background:#120b06;color:#ffe9a8;align-items:center;justify-content:center;text-align:center;font-family:'Jua','Malgun Gothic',sans-serif;font-size:24px;line-height:1.6}
  @media (orientation: portrait){ body.touch #rotate{display:flex} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="nickbox"><input id="nick" maxlength="8" placeholder="닉네임" autocomplete="off"><div id="slots"></div><div class="sub">닉네임을 쓰고 빈 저장칸의 "새로 시작"을 누르세요 (최대 8글자)</div></div>
<div id="touch">
  <div id="dpad">
    <button data-k="ArrowUp" style="grid-column:2;grid-row:1">▲</button>
    <button data-k="ArrowLeft" style="grid-column:1;grid-row:2">◀</button>
    <button data-k="ArrowRight" style="grid-column:3;grid-row:2">▶</button>
    <button data-k="ArrowDown" style="grid-column:2;grid-row:3">▼</button>
  </div>
  <div id="sys">
    <button data-k="KeyE">가방<br>E</button>
    <button data-k="KeyQ">버리기<br>Q</button>
    <button data-k="Escape">뒤로<br>Esc</button>
    <button data-k="KeyV">시점<br>V</button>
    <button data-k="FS">전체<br>화면</button>
  </div>
  <div id="acts">
    <button data-k="KeyG">하기<br>G</button>
    <button data-k="KeyF">물기<br>확인</button>
    <button data-k="ShiftLeft">달리기</button>
    <button data-k="Space">점프</button>
  </div>
</div>
<div id="rotate">📱<br>화면을 가로로<br>돌려 주세요</div>
<script>
"use strict";
/* ===== 개미들의 대모험 — 오프닝 컷신 (알이 깨지고 아기 개미가 태어난다) =====
   모든 그림은 코드로 그린다(이미지 파일 없음). 시간 t(초)만으로 장면이 결정된다. */
const W = 960, H = 540;
const EX = 480, GY = 455;          // 알 중심 x, 땅 y
const BURST = 7.2;                 // 알이 터지는 시각
const END = 18.5;                    // 제목이 뜨는 시각
const FONT = '"Jua","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
const BUILD = '2026-11-25 07:30';   // make-single.py가 만든 시각으로 바꿔 넣는다 (어느 버전을 열었는지 시작 화면에서 확인용)

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const nickEl = document.getElementById('nick'), nickBox = document.getElementById('nickbox'), slotsEl = document.getElementById('slots');
let slot = 1, lastSave = '', saveT = 0, resumed = false;
let nick = '개미', level = 1, food = 0, cheerUntil = 0, lvBanner = null, curT = 0, invSel = 0, xp = 0, gateCd = 0, dragUI = null;
const DROPS = [], FLY = [];
try { const sv = localStorage.getItem('antNick'); if (sv) nickEl.value = sv; } catch (e) {}
function begin(n) {   // 새로 시작 (저장칸 n)
  if (loadSave(n) && !confirm('저장 ' + n + '번에 이미 진행이 있어요.\n새로 시작하면 그 저장이 덮어써져요. 새로 시작할까요?')) return;
  slot = n; lastSave = '';
  nick = (nickEl.value || '').trim().slice(0, 8) || '개미';
  try { localStorage.setItem('antNick', nick); } catch (e) {}
  nickBox.style.display = 'none'; start();
}
function beginAuto() { let n = 1; for (let i = 1; i <= SLOTS; i++) if (!loadSave(i)) { n = i; break; } begin(n); }
slotsEl.addEventListener('click', ev => {
  const b = ev.target && ev.target.closest ? ev.target.closest('button') : null; if (!b) return;
  const n = +b.dataset.slot;
  if (b.dataset.act === 'cont') continueGame(n);
  else if (b.dataset.act === 'new') begin(n);
  else if (b.dataset.act === 'del') { if (confirm('저장 ' + n + '번을 지울까요?\n지우면 되돌릴 수 없어요.')) { try { localStorage.removeItem(SLOT_KEY(n)); } catch (e) {} refreshTitle(); } }
});
if (!/Mobi|Android|iPhone|iPad/i.test((typeof navigator !== 'undefined' && navigator.userAgent) || '')) setTimeout(() => nickEl.focus(), 100);
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  const r = cv.getBoundingClientRect();
  nickBox.style.top = (r.top + r.height * .5) + 'px';
  nickBox.style.transform = 'translate(-50%,0) scale(' + s + ')';
}
addEventListener('resize', resize); resize();

/* ---------- 유틸 ---------- */
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const seg = (t, a, b) => clamp((t - a) / (b - a));

/* ---------- 소리 (WebAudio, 클릭 후 시작) ---------- */
let AC = null;
function noise(dur, type, freq, vol) {
  if (!AC) return;
  const n = AC.sampleRate * dur, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(); s.buffer = b;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
}
function tone(f0, f1, dur, vol, type = 'sine') {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  tap:   () => { tone(160, 60, 0.12, 0.35); noise(0.05, 'lowpass', 600, 0.3); },
  crack: () => noise(0.14, 'highpass', 2500, 0.35),
  pop:   () => { noise(0.35, 'lowpass', 1800, 0.7); tone(220, 40, 0.3, 0.6); },
  chirp: () => { tone(700, 1300, 0.12, 0.25, 'triangle'); setTimeout(() => tone(900, 1500, 0.1, 0.2, 'triangle'), 150); },
  jump:  () => tone(300, 700, 0.18, 0.2, 'triangle'),
  bark:  () => { tone(520, 360, .09, .2, 'square'); setTimeout(() => tone(480, 320, .08, .18, 'square'), 120); },
  shot:  () => { tone(900, 160, 0.14, 0.28, 'sawtooth'); noise(0.1, 'bandpass', 1800, 0.25); },
  bite:  () => { noise(0.08, 'highpass', 3000, 0.5); tone(500, 150, 0.09, 0.3, 'square'); },
  beat:  st => tone(st ? 120 : 90, 50, 0.09, 0.14),
  hitP:  () => { tone(900, 1400, 0.1, 0.25, 'triangle'); noise(0.05, 'highpass', 3000, 0.25); },
  hitG:  () => tone(600, 900, 0.1, 0.2, 'triangle'),
  miss:  () => noise(0.1, 'lowpass', 400, 0.35),
  win:   () => { tone(500, 1000, 0.2, 0.3, 'triangle'); setTimeout(() => tone(700, 1400, 0.25, 0.3, 'triangle'), 180); setTimeout(() => tone(900, 1800, 0.4, 0.3, 'triangle'), 380); },
  levelup: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, f * 1.02, .18, .25, 'triangle'), i * 120)),
  sad:   () => { tone(330, 165, 1.8, 0.25); setTimeout(() => tone(247, 110, 2.2, 0.22), 900); },
};

/* ---------- 알 모양과 금 ---------- */
function eggPath(c) {
  c.beginPath();
  c.moveTo(0, -235);
  c.bezierCurveTo(60, -235, 92, -140, 92, -85);
  c.bezierCurveTo(92, -30, 55, 0, 0, 0);
  c.bezierCurveTo(-55, 0, -92, -30, -92, -85);
  c.bezierCurveTo(-92, -140, -60, -235, 0, -235);
  c.closePath();
}
const R = rng(7);
// 알이 둘로 쪼개지는 들쭉날쭉한 선
const ZIG = [];
for (let i = 0; i < 12; i++) ZIG.push([-104 + i * (208 / 11), -100 + (i % 2 ? -14 : 14) + (R() - .5) * 7]);
const CRACKS = [
  { pts: [[6,-230],[-4,-212],[8,-196],[-2,-180],[-16,-164],[-8,-150],[-20,-134]], a: 3.4, b: 4.2 },
  { pts: [[-2,-180],[14,-168],[10,-154],[24,-142]],                              a: 3.9, b: 4.5 },
  { pts: [[84,-150],[68,-138],[76,-124],[60,-112],[64,-100]],                    a: 4.4, b: 5.1 },
  { pts: [[-62,-60],[-48,-72],[-54,-86],[-40,-98]],                              a: 5.2, b: 5.8 },
  { pts: [[52,-40],[42,-56],[54,-70],[46,-92]],                                  a: 5.4, b: 6.0 },
  { pts: ZIG,                                                                    a: 5.8, b: 7.1, ring: true },
];
const SPECKS = []; { const r = rng(21); for (let i = 0; i < 16; i++) SPECKS.push([(r() - .5) * 120, -40 - r() * 160, 2 + r() * 3]); }

function strokePartial(c, pts, p) {
  let total = 0; const L = [];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); L.push(d); total += d; }
  let want = total * p; c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length && want > 0; i++) {
    const d = L[i-1];
    if (want >= d) { c.lineTo(pts[i][0], pts[i][1]); want -= d; }
    else { const k = want / d; c.lineTo(lerp(pts[i-1][0], pts[i][0], k), lerp(pts[i-1][1], pts[i][1], k)); want = 0; }
  }
  c.stroke();
}

// part: 'whole' | 'cap'(윗조각) | 'bowl'(아랫조각)
function drawEgg(c, t, part, glow) {
  c.save();
  eggPath(c); c.clip();
  if (part !== 'whole') {
    c.beginPath();
    c.moveTo(ZIG[0][0], part === 'cap' ? -300 : 40);
    for (const p of ZIG) c.lineTo(p[0], p[1]);
    c.lineTo(ZIG[ZIG.length-1][0], part === 'cap' ? -300 : 40);
    c.closePath(); c.clip();
  }
  const g = c.createRadialGradient(-30, -150, 10, 0, -110, 135);
  g.addColorStop(0, '#fff7de'); g.addColorStop(.55, '#ecdbb1'); g.addColorStop(1, '#c4a676');
  c.fillStyle = g; c.fillRect(-120, -260, 240, 280);
  for (const s of SPECKS) { c.fillStyle = 'rgba(150,108,58,.32)'; c.beginPath(); c.arc(s[0], s[1], s[2], 0, 7); c.fill(); }
  // 안에서 새어나오는 빛
  if (glow > 0) {
    const lg = c.createRadialGradient(0, -110, 5, 0, -110, 130);
    lg.addColorStop(0, `rgba(255,220,120,${.55 * glow})`); lg.addColorStop(1, 'rgba(255,180,60,0)');
    c.fillStyle = lg; c.fillRect(-120, -260, 240, 280);
  }
  // 금
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (const k of CRACKS) {
    if (k.ring && part !== 'whole') continue;
    const p = seg(t, k.a, k.b); if (p <= 0) continue;
    c.strokeStyle = '#4a2f18'; c.lineWidth = 3.4; strokePartial(c, k.pts, p);
    c.strokeStyle = `rgba(255,${200 + 40 * glow | 0},110,${.25 + .75 * glow})`; c.lineWidth = 1.4 + 1.6 * glow; strokePartial(c, k.pts, p);
  }
  // 깨진 면의 가장자리
  if (part !== 'whole') {
    c.strokeStyle = '#b79a68'; c.lineWidth = 5;
    c.beginPath(); ZIG.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.stroke();
    c.strokeStyle = '#fff3cf'; c.lineWidth = 2; c.stroke();
  }
  c.restore();
  // 윤곽선
  c.save();
  if (part !== 'whole') {
    c.beginPath();
    c.moveTo(ZIG[0][0], part === 'cap' ? -300 : 40);
    for (const p of ZIG) c.lineTo(p[0], p[1]);
    c.lineTo(ZIG[ZIG.length-1][0], part === 'cap' ? -300 : 40); c.closePath(); c.clip();
  }
  eggPath(c); c.strokeStyle = 'rgba(80,52,24,.75)'; c.lineWidth = 3; c.stroke();
  c.restore();
}

/* ---------- 아기 개미 ---------- */
function drawAnt(c, x, y, s, o) {
  const w = o.wig || 0;
  c.save(); c.translate(x, y); c.scale(s * (1 + (o.squash || 0)) * (o.flip || 1), s * (1 - (o.squash || 0)));
  c.lineCap = 'round'; c.lineJoin = 'round';
  const dark = '#3a2213';
  // 다리
  c.strokeStyle = dark; c.lineWidth = 4.5;
  const spread = o.spread || 0;
  [[-14, -1], [-4, 0], [6, 1]].forEach(([hx, d], i) => {
    const sw = Math.sin((o.leg || 0) + i * 2.1) * (3 + (o.walk || 0) * 7);
    c.beginPath(); c.moveTo(hx, 10);
    c.lineTo(hx + d * 12 + sw * .5, 24 - spread * 6);
    c.lineTo(hx + d * 20 + sw + d * spread * 8, 42 - spread * 14);
    c.stroke();
  });
  // 더듬이
  c.lineWidth = 3.2;
  [[40, -26, 24, 1], [26, -28, 12, 0]].forEach(([bx, by, ex, k]) => {
    const ax = bx + ex + Math.sin(w * 3 + k * 2) * 5, ay = by - 26 + Math.cos(w * 3 + k) * 4 - (o.perk || 0) * 8;
    c.beginPath(); c.moveTo(bx, by); c.quadraticCurveTo(bx + 4, by - 20, ax, ay); c.stroke();
    c.fillStyle = dark; c.beginPath(); c.arc(ax, ay, 4, 0, 7); c.fill();
  });
  // 몸통
  const body = (cx, cy, rx, ry) => {
    const g = c.createRadialGradient(cx - rx * .3, cy - ry * .5, 2, cx, cy, Math.max(rx, ry));
    g.addColorStop(0, o.c0 || '#9a6340'); g.addColorStop(1, o.c1 || '#5a351f');
    c.fillStyle = g; c.strokeStyle = dark; c.lineWidth = 2.5;
    c.beginPath(); c.ellipse(cx, cy, rx, ry, 0, 0, 7); c.fill(); c.stroke();
  };
  body(-42, 6, 29, 22);
  c.fillStyle = dark; c.beginPath(); c.arc(-22, 5, 5, 0, 7); c.fill();
  body(-6, 2, 16, 14);
  body(30, -4, 26, 25);
  // 눈
  const eye = (ex, ey, r) => {
    const h = r * 1.15 * (1 - (o.blink || 0));
    c.fillStyle = '#fff'; c.strokeStyle = dark; c.lineWidth = 1.5;
    c.beginPath(); c.ellipse(ex, ey, r, Math.max(1, h), 0, 0, 7); c.fill(); c.stroke();
    if ((o.blink || 0) < .7) {
      c.fillStyle = '#140a04'; c.beginPath(); c.arc(ex + (o.lx || 0) * 3, ey + (o.ly || 0) * 3, r * .55, 0, 7); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(ex + (o.lx || 0) * 3 + 1.5, ey + (o.ly || 0) * 3 - 2, 1.8, 0, 7); c.fill();
    }
  };
  eye(40, -9, 9); eye(19, -9, 8);
  // 볼과 입
  c.fillStyle = 'rgba(255,120,120,.4)'; c.beginPath(); c.ellipse(48, 7, 6, 4, 0, 0, 7); c.fill();
  c.strokeStyle = dark; c.lineWidth = 2.2; c.beginPath();
  const op = Math.max(o.open || 0, o.bite || 0);
  if (op) c.ellipse(34, 10, 5, 5 * op, 0, 0, 7); else c.arc(34, 6, 7, .15 * Math.PI, .85 * Math.PI);
  c.stroke();
  if (o.bite) {  // 물기: 큰턱이 벌어졌다 닫힌다
    const b = o.bite; c.lineWidth = 5; c.strokeStyle = dark;
    c.beginPath(); c.moveTo(50, 4); c.quadraticCurveTo(66, 4 - 12 * b, 74, 2 - 4 * b); c.stroke();
    c.beginPath(); c.moveTo(50, 12); c.quadraticCurveTo(66, 12 + 12 * b, 74, 14 + 4 * b); c.stroke();
    c.strokeStyle = '#fff'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(66, 4 - 10 * b); c.lineTo(74, 2 - 4 * b); c.moveTo(66, 12 + 10 * b); c.lineTo(74, 14 + 4 * b); c.stroke();
  }
  c.restore();
}

/* ---------- 배경: 개미굴 속 알 방 ---------- */
const NEST = []; { const r = rng(5); for (let i = 0; i < 26; i++) NEST.push({ a: r() * 6.28, d: .7 + r() * .35, rot: r() * 3.14, w: 30 + r() * 26, c: ['#6b7a2e','#8a6a2a','#5b4a1f','#7d8a3a','#a07a35'][i % 5], front: r() > .55 }); }
const MOTES = []; { const r = rng(9); for (let i = 0; i < 50; i++) MOTES.push({ x: r() * W, y: r() * 470, s: .3 + r() * .7, p: r() * 6.28, z: 1 + r() * 2 }); }
const ROOTS = []; { const r = rng(13); for (let i = 0; i < 9; i++) ROOTS.push({ x: 60 + i * 105 + r() * 40, dx: (r() - .5) * 60, len: 60 + r() * 120 }); }

function drawBG(c, t) {
  c.fillStyle = '#100905'; c.fillRect(-100, -80, W + 200, H + 160);
  // 굴 방(타원형 공간)

  if (pet.fscene !== scene) { pet.fscene = scene; pet.x = tx; pet.y = ty; }

/* ---------- 저장 / 이어하기 ----------
   브라우저(localStorage)에 자동 저장한다. 파일을 업데이트해도 같은 브라우저에서는 그대로 남는다.
   저장 데이터에 버전(v)을 두고, 읽을 때 값을 검사해서 새로 생긴 항목은 기본값으로, 사라진 항목은 버린다. */
const SAVE_VER = 3, SLOTS = 3, SLOT_KEY = n => 'antAdventure.save.' + n;

function migrateOldSave() {
  try {

    for (let i = 1; i <= SLOTS; i++) if (!localStorage.getItem(SLOT_KEY(i))) { localStorage.setItem(SLOT_KEY(i), old); localStorage.removeItem('antAdventure.save'); return; }
  } catch (e) {}
}

    const d = JSON.parse(raw); if (!d || typeof d !== 'object') return null;

    const o = { nick: typeof d.nick === 'string' && d.nick.trim() ? d.nick.slice(0, 8) : '개미', level: num(d.level, 1, 99, 1), xp: num(d.xp, 0, 1e6, 0), food: num(d.food, 0, 1e6, 0), inv: {}, flowers: [], worm: !!d.worm, pond: num(d.pond, 0, 9999, 0), train: num(d.train, 0, 15, 0), kit: !!d.kit };
    if (d.inv && typeof d.inv === 'object') for (const k in d.inv) if (ITEMS[k]) { const n = num(d.inv[k], 0, 9999, 0); if (n > 0) o.inv[k] = n; }

}
function saveGame() {
  if (state !== 'play' || ending || !player.active) return;
  const flowers = []; OUT.flowers.forEach((f, i) => { if (f.cut) flowers.push(i); });
  const data = JSON.stringify({ v: SAVE_VER, nick, level, xp, food, inv, flowers, worm: wormEver ? 1 : 0, pond: pondWins, train, kit: 1 });
  if (data === lastSave) return;
  try { localStorage.setItem(SLOT_KEY(slot), data); lastSave = data; } catch (e) {}
}
function refreshTitle() {
  migrateOldSave();

  let html = '', first = '';
  for (let i = 1; i <= SLOTS; i++) {
    const sv = loadSave(i);
    if (sv) { if (!first) first = sv.nick; html += '<div class="slot"><span class="lab">저장 ' + i + ' · Lv.' + sv.level + ' ' + esc(sv.nick) + '<small>연못 ' + sv.pond + '승 · 굴 식량 ' + sv.food + '</small></span><button data-act="cont" data-slot="' + i + '">이어하기</button><button class="del" data-act="del" data-slot="' + i + '">삭제</button></div>'; }
    else html += '<div class="slot"><span class="lab">저장 ' + i + ' · 비어 있음</span><button data-act="new" data-slot="' + i + '">새로 시작</button></div>';

function toTitle() { saveGame(); if (document.body) document.body.classList.remove('playing'); state = 'ready'; refreshTitle(); nickBox.style.display = ''; nickEl.focus(); }
function continueGame(n) {
  const sv = loadSave(n); if (!sv) return;
  slot = n; nickBox.style.display = 'none';
  start();                                   // 소리 잠금 해제 + 초기화
  nick = sv.nick; resumed = true;
  for (let i = 0; i < 20 * 30; i++) { t += 1 / 30; update(1 / 30, t); }   // 오프닝 컷신은 건너뛰고 20초 지점에서 이어감
  for (const e of events) e.done = true;
  level = sv.level; xp = sv.xp; food = sv.food; wormEver = sv.worm; pondWins = sv.pond; train = sv.train;
  for (const k in inv) delete inv[k];
  Object.assign(inv, sv.inv);
  if (!sv.kit) { inv.gun = (inv.gun || 0) + 1; inv.twig = (inv.twig || 0) + 1; }   // 예전 저장: 새 도구를 한 번 지급
  sv.flowers.forEach(i => { OUT.flowers[i].cut = true; });

}
addEventListener('pagehide', () => saveGame());
addEventListener('beforeunload', () => saveGame());

/* ---------- 휴대폰 터치 조작: 화면 버튼이 키보드 입력을 대신 보낸다 ---------- */
try {
  const touchy = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || /[?&]touch=1/.test(location.search);
  if (touchy && document.body) document.body.classList.add('touch');
  const fire = (type, code) => { try { window.dispatchEvent(new KeyboardEvent(type, { code, key: code, bubbles: true })); } catch (e) {} };
  document.querySelectorAll('#touch button').forEach(b => {
    const code = b.dataset.k;
    if (code === 'FS') { b.addEventListener('click', () => { try { const d = document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : d.requestFullscreen()); } catch (e) {} }); return; }
    b.addEventListener('pointerdown', ev => { ev.preventDefault(); try { b.setPointerCapture(ev.pointerId); } catch (e) {} b.classList.add('on'); fire('keydown', code); });
    const up = ev => { ev.preventDefault(); if (b.classList.contains('on')) { b.classList.remove('on'); fire('keyup', code); } };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
    b.addEventListener('contextmenu', ev => ev.preventDefault());
  });
} catch (e) {}

try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js'); } catch (e) {}

/* ---------- 휴대폰: 화면 드래그로 이동(1인칭에서는 둘러보기) + 지렁이 리듬게임 터치 / 컴퓨터: 마우스로 둘러보기 ---------- */
try {
  const isTouchUI = () => !!(document.body && document.body.classList.contains('touch'));
  const drag = { on: false, id: -1, x0: 0, y0: 0, mode: 'move', lx: 0, ly: 0, moved: 0, t0: 0 };
  const logical = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
  const clearDragKeys = () => { keys.ArrowLeft = keys.ArrowRight = keys.ArrowUp = keys.ArrowDown = keys.ShiftLeft = false; };
  cv.addEventListener('pointerdown', e => {
    if (!isTouchUI() || state !== 'play') return;
    const [lx, ly] = logical(e);
    if (mg) {   // 지렁이 리듬게임: 화살표 줄을 직접 터치
      if (!mg.result) for (let l = 0; l < 4; l++) if (Math.abs(lx - (480 + (l - 1.5) * 100)) < 50 && ly > 60 && ly < 470) { mgPress(l); break; }
      return;
    }
    if (cs || bt || gym || invOpen || ending) return;
    drag.on = true; drag.id = e.pointerId; drag.x0 = e.clientX; drag.y0 = e.clientY; drag.lx = e.clientX; drag.ly = e.clientY; drag.moved = 0; drag.t0 = performance.now();
    drag.mode = (FP.on && scene === 'out') ? 'look' : 'move';
    if (drag.mode === 'move') dragUI = { x0: lx, y0: ly, x: lx, y: ly };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cv.addEventListener('pointermove', e => {
    if (!drag.on || e.pointerId !== drag.id) return;
    if (drag.mode === 'look') {   // 1인칭: 드래그로 둘러보기
      const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly; drag.lx = e.clientX; drag.ly = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
      FP.yaw += dx * .006; FP.pitch = clamp(FP.pitch - dy * .003, -.7, .7);
      return;
    }
    let dx = e.clientX - drag.x0, dy = e.clientY - drag.y0; const d = Math.hypot(dx, dy), R = 70;
    if (d > R * 1.6) { drag.x0 += dx / d * (d - R * 1.6); drag.y0 += dy / d * (d - R * 1.6); dx = e.clientX - drag.x0; dy = e.clientY - drag.y0; }
    const dd = Math.hypot(dx, dy), cc = dd ? dx / dd : 0, ss = dd ? dy / dd : 0;
    if (dd < 14) clearDragKeys();
    else { keys.ArrowRight = cc > .38; keys.ArrowLeft = cc < -.38; keys.ArrowDown = ss > .38; keys.ArrowUp = ss < -.38; keys.ShiftLeft = dd > R * 1.2; }
    const [lx, ly] = logical(e), [ax0, ay0] = logical({ clientX: drag.x0, clientY: drag.y0 });
    dragUI = { x0: ax0, y0: ay0, x: lx, y: ly };
  });
  const endDrag = e => {
    if (drag.on && e.pointerId === drag.id) {
      if (drag.mode === 'look' && drag.moved < 12 && performance.now() - drag.t0 < 350) fireGun();   // 가볍게 탭 = 개미산 발사
      drag.on = false; dragUI = null; clearDragKeys();
    }
  };
  cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
  // 컴퓨터: 1인칭에서 화면을 클릭하면 마우스가 잠기고(둘러보기), 잠긴 뒤 클릭은 발사
  cv.addEventListener('click', () => {
    if (isTouchUI() || !FP.on || scene !== 'out' || state !== 'play' || busy()) return;
    if (document.pointerLockElement !== cv) { if (cv.requestPointerLock) cv.requestPointerLock(); } else fireGun();
  });
  window.addEventListener('mousemove', e => {
    if (!FP.on || scene !== 'out' || busy()) return;
    if (document.pointerLockElement === cv || (e.buttons & 1)) { FP.yaw += (e.movementX || 0) * .0026; FP.pitch = clamp(FP.pitch - (e.movementY || 0) * .0016, -.7, .7); }
  });
} catch (e) {}

/* ---------- 재생 루프 ---------- */
let state = 'ready', t = 0, last = performance.now();
reset();
refreshTitle();
function start() {
  if (document.body) document.body.classList.add('playing');
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  reset(); t = 0; state = 'play';
}
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state === 'play') {
    t += dt;
    for (const e of events) if (!e.done && !ending && t >= e.t) { e.done = true; sfx[e.f](); }
    update(dt, t);
    saveT += dt; if (saveT > 2) { saveT = 0; saveGame(); }

  }

    c.fillStyle = '#120b06'; c.fillRect(0, 0, W, H);
    c.save(); c.translate(EX, GY); drawEgg(c, 0, 'whole', 0); c.restore();
    c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(0, 0, W, H);
    c.textAlign = 'center'; c.fillStyle = '#ffe9a8'; c.font = `40px ${FONT}`; c.fillText('개미들의 대모험', W / 2, 200);
    c.font = `22px ${FONT}`; c.fillStyle = '#fff'; c.fillText('닉네임을 정해 주세요', W / 2, 250);
    c.font = `13px ${FONT}`; c.fillStyle = 'rgba(255,255,255,.55)'; c.fillText('버전 ' + BUILD, W / 2, H - 22);
  } else render(t);

}
requestAnimationFrame(loop);
addEventListener('keydown', e => {
  if (state === 'ready') { if (e.code === 'Enter' && document.activeElement === nickEl) beginAuto(); return; }
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (state !== 'play') { if (e.code === 'Space' || e.code === 'Enter') start(); return; }
  if (e.code === 'KeyR') { toTitle(); return; }
  if (bt) { btKey(e); return; }
  if (cs) { csKey(e); return; }
  if (hs) { hsKey(e); return; }
  if (mg) { mgKey(e); return; }
  if (invOpen && invKey(e)) return;
  if (e.code === 'KeyV' && !e.repeat && scene === 'out' && player.active && !busy()) { toggleFP(); return; }
  if (e.code === 'KeyX' && !e.repeat) { fireGun(); return; }
  if (e.code === 'KeyL' && e.shiftKey && !e.repeat) { const o = level; level = 6; xp = 0; lvBanner = { t: 0, old: o, now: 6 }; sfx.levelup(); }   // 개발용
  if (e.code === 'KeyF' && !e.repeat) player.wantBite = true;
  if (e.code === 'KeyG' && !e.repeat) player.wantDeposit = true;
  if (e.code === 'Space' && !e.repeat) player.wantJump = true;
  if (e.code === 'KeyE' && !e.repeat && player.active && !trans && !ending && !mg && !hs && !cs && !bt) invOpen = !invOpen;
  if (e.code === 'Escape') invOpen = false;
  keys[e.code] = true;
});
addEventListener('pointerdown', e => {
  if (state !== 'play' || !invOpen) return;
  const r = cv.getBoundingClientRect(), mx = (e.clientX - r.left) / r.width * W, my = (e.clientY - r.top) / r.height * H;
  const pw = 600, ph = 340, px = (W - pw) / 2, py = (H - ph) / 2, cols = 6, sz = 76, gap = 12;
  const gx = px + (pw - (cols * sz + (cols - 1) * gap)) / 2, gy = py + 74, ids = invIds();
  for (let i = 0; i < ids.length; i++) {
    const x = gx + (i % cols) * (sz + gap), y = gy + Math.floor(i / cols) * (sz + gap - 2);
    if (mx >= x && mx <= x + sz && my >= y && my <= y + sz - 6) { invSel = i; return; }
  }
  if (ids[invSel] && mx >= px + pw - 150 && mx <= px + pw - 20 && my >= py + ph - 56 && my <= py + ph - 20) dropItem(ids[invSel]);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
